name: patrol check semver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/patrol/**'

jobs:
  check_semver:
    name: Check semver
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.44.x']
        flutter-channel: ['stable']

    steps:
        - name: Clone repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ matrix.flutter-version }}
            channel: ${{ matrix.flutter-channel }}

        # Fails only on release/* branches; elsewhere it just reports the
        # recommended version in a `semver (patrol)` commit status.
        - name: Check semver
          uses: ./.github/actions/check-semver
          with:
            package: patrol
            path: packages/patrol
