name: patrol_cli prepare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/patrol_cli/**'

jobs:
  main:
    name: Flutter ${{ matrix.flutter-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: packages/patrol_cli

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Run flutter tool (to dismiss the first run experience)
        run: flutter

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: dart pub get
        run: dart pub get

      - name: Build executable
        run: dart pub global activate --source path .

      - name: Run executable (smoke test)
        run: patrol

      - name: dart test
        run: dart test

      - name: Run analyzer
        if: success() || failure()
        run: |
          flutter analyze
          dart run custom_lint

      - name: dart format
        run: dart format --set-exit-if-changed .

      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@d5b02aa28c6f34697d64b1021a86544172bbea5d # pana-score-v1.2
        with:
          path: packages/patrol_cli
