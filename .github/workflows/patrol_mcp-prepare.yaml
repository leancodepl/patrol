name: patrol_mcp prepare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/patrol_mcp/**'
      - 'tool/check_dependency_floors.sh'
      - '.github/actions/check-dependency-floors/**'

jobs:
  smoke_test:
    name: Smoke (${{ matrix.resolution }} patrol_cli) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # floor = lowest patrol_cli the constraint allows; fails here if patrol_mcp
        # outgrew its constraint, rather than shipping broken to users.
        resolution: [latest, floor]

    defaults:
      run:
        working-directory: packages/patrol_mcp

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # pub.dev, not melos: local resolution would mask a stale patrol_cli constraint.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve dependencies (from pub.dev)
        run: dart pub get

      # Only patrol_cli, not a full downgrade (that drags in unfixable old
      # transitive floors like win32).
      - name: Downgrade patrol_cli to its constraint floor
        if: matrix.resolution == 'floor'
        run: dart pub downgrade patrol_cli

      - name: Smoke test — server starts, handshakes, and shuts down on EOF
        run: dart run tool/smoke_test.dart

      - name: Unit tests
        run: dart test

  dependency-floors:
    name: Dependency floors
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      # No `melos bootstrap` on purpose: its pubspec_overrides.yaml would
      # resolve the siblings from their paths, which users don't get.
      - name: Check dependency floors
        uses: ./.github/actions/check-dependency-floors
        with:
          package: patrol_mcp

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: packages/patrol_mcp
