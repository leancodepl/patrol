name: patrol_finders prepare

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/_relevant.yaml
    with:
      filters: |
        relevant:
          - 'packages/patrol_finders/**'

  prepare:
    name: Flutter ${{ matrix.flutter-version }}
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: packages/patrol_finders

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        if: success() || failure()
        run: flutter test

      - name: flutter test (web)
        if: success() || failure()
        run: flutter test --platform chrome

      - name: Run analyzer
        if: success() || failure()
        run: |
          flutter analyze
          dart run custom_lint

      - name: dart format
        if: success() || failure()
        run: dart format --set-exit-if-changed .

      - name: flutter pub publish --dry-run
        # Still reports issues, but does not fail the PR on pub's false-positive analyzer warning (exit 65).
        if: success() || failure()
        continue-on-error: true
        run: flutter pub publish --dry-run

      - name: flutter pub get (example app)
        if: success() || failure()
        working-directory: ./packages/patrol_finders/example
        run: flutter pub get

      - name: flutter test (example app)
        if: success() || failure()
        working-directory: ./packages/patrol_finders/example
        run: flutter test

  pana-score:
    name: pana score
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: packages/patrol_finders

  patrol_finders-prepare-gate:
    name: patrol_finders prepare gate
    needs: [changes, prepare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass: ${{ join(needs.*.result, ' ') }}"
            exit 1
          fi
          echo "All required jobs passed or were skipped: ${{ join(needs.*.result, ' ') }}"
