name: test patrol develop

on:
  workflow_dispatch:
  # Not `pull_request_target`: this workflow needs no secrets, and that trigger
  # checked out the base branch, so every run tested master instead of the PR.
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/patrol/**'
      - 'packages/patrol_finders/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_cli/**'
      - 'packages/adb/**'
      - 'packages/patrol_gen/**'
      - 'dev/e2e_app/**'
      - 'dev/cli_tests/**'
      - 'schema.dart'
      - 'gen_from_schema'
      - '!**.md'
      - '!**.mdx'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test `patrol develop` on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable

      - name: Preload Flutter artifacts
        run: flutter precache --android

      - name: Set up Melos and activate workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run patrol develop test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          ram-size: 3072M
          disk-size: 6G
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim
          script: cd dev/cli_tests && dart pub get && dart patrol_develop_test.dart

  test-macos:
    name: Test `patrol develop` on macOS
    # macos-15 is on macOS 15.7, where simulator mDNS is broken and
    # `flutter attach` cannot discover the app. See flutter#166333.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable

      - name: Preload Flutter artifacts
        run: flutter precache --ios

      - name: Set up Melos and activate workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Start iOS simulator
        uses: futureware-tech/simulator-action@v2
        with:
          # iPhone 16 Pro has no iOS 26.2 device on the macos-latest image.
          model: iPhone 17
          os: iOS
          # The version must match the version specified in the --ios flag.
          os_version: '26.2'
          erase_before_boot: true
          shutdown_after_job: true

      - name: Run patrol develop test
        working-directory: dev/cli_tests
        run: |
          dart pub get
          dart patrol_develop_test.dart --ios 26.2

  test-web:
    name: Test `patrol develop` on Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Hot Restart on web needs flutter/flutter#183838, which is not in
      # stable 3.44.x, hence beta rather than the pin the other jobs use.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta

      - name: Preload Flutter artifacts
        run: flutter precache --web

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/patrol/web_runner/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/patrol/web_runner/package-lock.json') }}

      - name: Set up Melos and activate workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Run patrol develop test
        working-directory: dev/cli_tests
        run: |
          dart pub get
          xvfb-run --auto-servernum dart patrol_develop_test.dart --web
