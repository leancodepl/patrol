name: adb prepare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/adb/**'

jobs:
  main:
    name: Dart ${{ matrix.dart-version }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        dart-version: ['3.8']

    defaults:
      run:
        working-directory: packages/adb

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: dart pub get
        run: dart pub get

      - name: dart test
        run: dart test

      - name: Run analyzer
        if: success() || failure()
        run: |
          dart analyze
          dart run custom_lint

      - name: dart format
        run: dart format --set-exit-if-changed .

      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

      - name: Score with pana
        if: success() || failure()
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@d5b02aa28c6f34697d64b1021a86544172bbea5d # pana-score-v1.2
        with:
          path: packages/adb
