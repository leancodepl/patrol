name: test ios simulator

on:
  workflow_dispatch:
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_relevant.yaml
    with:
      filters: |
        relevant:
          - 'packages/patrol/**'
          - 'packages/patrol_finders/**'
          - 'packages/patrol_log/**'
          - 'packages/patrol_cli/**'
          - 'packages/adb/**'
          - 'packages/patrol_gen/**'
          - 'dev/e2e_app/**'
          - 'schema.dart'
          - 'gen_from_schema'
          - '!**.md'
          - '!**.mdx'

  run_tests:
    name: Flutter ${{ matrix.flutter-version }} on ${{ matrix.device_model }} (${{ matrix.os_version }}) simulator
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      SLACK_MESSAGE_TITLE: Flutter ${{ matrix.flutter-version }} on ${{ matrix.os }} ${{ matrix.os_version }} simulator
      TESTS_EXIT_CODE: ${{ steps.tests_step.outputs.TESTS_EXIT_CODE }}
      FAILURE_STATUS: ${{ steps.status_step.outputs.FAILURE_STATUS }}
      ERROR_STATUS: ${{ steps.status_step.outputs.ERROR_STATUS }}

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.38.x"]
        flutter-channel: ["stable"]
        device_model:
          [iPhone 17]
        os_version: ["26.2"]
        os: [iOS]

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --ios

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Start iOS simulator
        uses: futureware-tech/simulator-action@v2
        with:
          model: ${{ matrix.device_model }}
          os: ${{ matrix.os }}
          os_version: ${{ matrix.os_version }}
          erase_before_boot: true
          shutdown_after_job: true

      - name: Run UI tests
        id: tests_step
        run: |
          xcrun simctl spawn booted log stream --type log --color none > all_simulator_logs.txt &
          logpid="$!"

          sleep 10 # See https://github.com/leancodepl/patrol/issues/1282

          # Running single test to verify workflow stability
          # Test: pull_to_refresh_test.dart
          # Patrol records one MP4 per test case via --record-video (iOS simulator).
          # Videos are written to dev/e2e_app/videos and uploaded as artifacts below.
          TESTS_EXIT_CODE=0
          patrol test \
          --target patrol_test/pull_to_refresh_test.dart \
          --verbose \
          --ios 26.2 \
          --full-isolation \
          --record-video \
          --video-output-dir videos || TESTS_EXIT_CODE=$?

          kill -SIGINT $logpid 2>/dev/null || true
          sleep 1
          kill -9 $logpid 2>/dev/null || true
          
          echo "TESTS_EXIT_CODE=$TESTS_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $TESTS_EXIT_CODE

      - name: Check if something went wrong
        id: status_step
        if: always()
        run: >
          if [ -z ${{ steps.tests_step.outputs.TESTS_EXIT_CODE }} ]; then 
            echo "ERROR_STATUS=error" >> "$GITHUB_OUTPUT";
          elif [ ! ${{ steps.tests_step.outputs.TESTS_EXIT_CODE }} == 0 ]; then
            echo "FAILURE_STATUS=failure" >> "$GITHUB_OUTPUT";
          fi;

      - name: Find xcresult path
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        run: |
          brew install coreutils # to provide realpath binary
          echo "XCRESULT_PATH=$(realpath build/ios_results_*.xcresult)" >> $GITHUB_ENV

      - name: Install xcresultparser
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcresultparser

      - name: Parse xcresult to JUnit format
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        run: |
          mkdir -p test-results
          xcresultparser -o junit "${{ env.XCRESULT_PATH }}" > test-results/junit-report.xml

      - name: Convert JUnit to CTRF format
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        run: |
          npx junit-to-ctrf test-results/junit-report.xml -o test-results/ctrf-report.json

      - name: Publish test report to summary
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: '${{ github.workspace }}/dev/e2e_app/test-results/ctrf-report.json'
          summary-report: true
          failed-report: true
          github-report: true
          title: 'Patrol tests on ${{ matrix.device_model }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload XCRESULT test result to artifacts
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        uses: actions/upload-artifact@v4
        with:
          name: Test result from ${{ matrix.device_model }}.xcresult
          path: ${{ env.XCRESULT_PATH }}

      - name: Upload simulator logs to artifacts
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        uses: actions/upload-artifact@v4
        with:
          name: Logs from ${{ matrix.device_model }}
          path: |
            ${{ github.workspace }}/dev/e2e_app/all_simulator_logs.txt

      - name: Upload recorded videos to artifacts
        id: upload_videos
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) }}
        uses: actions/upload-artifact@v4
        with:
          name: Recorded videos from ${{ matrix.device_model }}
          path: ${{ github.workspace }}/dev/e2e_app/videos/
          if-no-files-found: warn

      - name: Add recordings link to job summary
        if: ${{ (failure() || success()) && contains(fromJson('["success", "failure"]'), steps.tests_step.conclusion) && steps.upload_videos.outputs.artifact-url }}
        run: |
          {
            echo "### 📹 Test recordings (${{ matrix.device_model }})";
            echo "";
            echo "One MP4 per test case, recorded with \`patrol test --record-video\`.";
            echo "";
            echo "[⬇️ Download recorded videos](${{ steps.upload_videos.outputs.artifact-url }})";
          } >> "$GITHUB_STEP_SUMMARY"

  call_send_slack_message:
    name: Notify on Slack
    uses: ./.github/workflows/send-slack-message.yaml
    needs: run_tests
    if: always()
    with:
      TESTS_EXIT_CODE: ${{ needs.run_tests.outputs.TESTS_EXIT_CODE }}
      FAILURE_STATUS: ${{ needs.run_tests.outputs.FAILURE_STATUS }}
      ERROR_STATUS: ${{ needs.run_tests.outputs.ERROR_STATUS }}
      SLACK_MESSAGE_TITLE: ${{ needs.run_tests.outputs.SLACK_MESSAGE_TITLE }}
    secrets: inherit

  test-ios-simulator-gate:
    name: test ios simulator gate
    needs: [changes, run_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass: ${{ join(needs.*.result, ' ') }}"
            exit 1
          fi
          echo "All required jobs passed or were skipped: ${{ join(needs.*.result, ' ') }}"
