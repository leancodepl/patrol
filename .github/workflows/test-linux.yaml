name: test linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/patrol/**'
      - 'packages/patrol_finders/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_cli/**'
      - 'dev/e2e_app/**'
      - '.github/workflows/test-linux.yaml'
      - '!**.md'
      - '!**.mdx'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Flutter ${{ matrix.flutter-version }} on Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --linux

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Run Linux tests
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x1000x24" \
            patrol test --target patrol_test/linux/ -d linux --verbose 2>&1 | tee patrol-linux.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-linux-log-${{ matrix.flutter-version }}
          path: dev/e2e_app/patrol-linux.log
          retention-days: 7
