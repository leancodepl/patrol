name: test web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/patrol/**'
      - 'packages/patrol_finders/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_cli/**'
      - 'packages/adb/**'
      - 'packages/patrol_gen/**'
      - 'dev/e2e_app/**'
      - 'packages/patrol/web_runner/**'
      - '!**.md'
      - '!**.mdx'
      - 'dev/e2e_app/patrol_test/web/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Flutter ${{ matrix.flutter-version }} on Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
  
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --web

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Run web tests
        id: tests_step
        run: |
          TESTS_EXIT_CODE=0
          # Do not use tags here, tags do not work with patrol web tests
          patrol test --target patrol_test/web/ -d chrome --verbose --web-headless true --web-workers 1 --web-locale en-US || TESTS_EXIT_CODE=$?

          echo "TESTS_EXIT_CODE=$TESTS_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $TESTS_EXIT_CODE

      - name: Run web device emulation tests
        run: |
          patrol test --target patrol_test/web/device_emulation/ -d chrome --verbose --web-headless \
            --web-report-dir "$PWD/playwright-report/device-pixel-7" --web-results-dir "$PWD/test-results/device-pixel-7" \
            --web-device "Pixel 7" \
            --dart-define=EMULATED_PLATFORM=android \
            --dart-define=EMULATED_DEVICE_PIXEL_RATIO=2.625 \
            --dart-define=EMULATED_SIZE=412x839 \
            --dart-define=EMULATED_SCREEN=412x915
          patrol test --target patrol_test/web/device_emulation/ -d chrome --verbose --web-headless \
            --web-report-dir "$PWD/playwright-report/device-iphone-15" --web-results-dir "$PWD/test-results/device-iphone-15" \
            --web-device "iPhone 15" \
            --dart-define=EMULATED_PLATFORM=iOS \
            --dart-define=EMULATED_DEVICE_PIXEL_RATIO=3 \
            --dart-define=EMULATED_SIZE=393x659 \
            --dart-define=EMULATED_SCREEN=393x852

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.flutter-version }}
          path: dev/e2e_app/playwright-report/
          retention-days: 7
