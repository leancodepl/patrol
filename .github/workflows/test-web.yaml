name: test web

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'packages/patrol/**'
              - 'packages/patrol_finders/**'
              - 'packages/patrol_log/**'
              - 'packages/patrol_cli/**'
              - 'packages/adb/**'
              - 'packages/patrol_gen/**'
              - 'dev/e2e_app/**'
              - '!**.md'
              - '!**.mdx'
      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=${{ steps.filter.outputs.relevant }}" >> "$GITHUB_OUTPUT"
          fi

  run_tests:
    name: Flutter ${{ matrix.flutter-version }} on Web
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
  
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --web

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Run web tests
        id: tests_step
        run: |
          TESTS_EXIT_CODE=0
          # Do not use tags here, tags do not work with patrol web tests
          patrol test --target patrol_test/web/ -d chrome --verbose --web-headless true --web-workers 1 --web-locale en-US || TESTS_EXIT_CODE=$?

          echo "TESTS_EXIT_CODE=$TESTS_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $TESTS_EXIT_CODE

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.flutter-version }}
          path: dev/e2e_app/playwright-report/
          retention-days: 7

  test-web-gate:
    name: test web gate
    needs: [changes, run_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass: ${{ join(needs.*.result, ' ') }}"
            exit 1
          fi
          echo "All required jobs passed or were skipped: ${{ join(needs.*.result, ' ') }}"
