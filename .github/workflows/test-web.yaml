name: test web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/test-web.yaml'
      - 'packages/patrol/**'
      - 'packages/patrol_finders/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_cli/**'
      - 'packages/adb/**'
      - 'packages/patrol_gen/**'
      - 'dev/e2e_app/**'
      - 'packages/patrol/web_runner/**'
      - '!**.md'
      - '!**.mdx'
      - 'dev/e2e_app/patrol_test/web/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  web_runner:
    name: Web runner on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']
    defaults:
      run:
        working-directory: packages/patrol/web_runner
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.patrol-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/patrol/web_runner/package-lock.json
      - run: npm ci
      - name: Install Chromium into a fresh browser cache
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Run web runner unit tests
        run: npx playwright test --config=playwright.unit.config.ts
      - name: Run web runner browser integration tests
        run: npx playwright test --config=playwright.integration.config.ts

  run_tests:
    name: Flutter ${{ matrix.flutter-version }} on Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
  
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.38.x']
        flutter-channel: ['stable']

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --web

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Run web tests
        id: tests_step
        run: |
          TESTS_EXIT_CODE=0
          # Do not use tags here, tags do not work with patrol web tests
          patrol test --target patrol_test/web/ -d chrome --verbose --web-headless true --web-workers 1 --web-locale en-US || TESTS_EXIT_CODE=$?

          echo "TESTS_EXIT_CODE=$TESTS_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $TESTS_EXIT_CODE

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.flutter-version }}
          path: dev/e2e_app/playwright-report/
          retention-days: 7
