name: test android emulator

# Builds the APKs only, with no secrets, so it can run PR code from forks.
# run-android-emulator.yaml runs them on emulator.wtf.

on:
  workflow_dispatch:
  schedule:
    # run this workflow every 12 hours
    - cron: "0 */12 * * *"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/test-android-emulator.yaml'
      - '.github/workflows/run-android-emulator.yaml'
      - 'packages/patrol/**'
      - 'packages/patrol_finders/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_cli/**'
      - 'packages/adb/**'
      - 'packages/patrol_gen/**'
      - 'dev/e2e_app/**'
      - 'schema.dart'
      - 'gen_from_schema'
      - '!**.md'
      - '!**.mdx'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs with Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      matrix:
        flutter-version: ["3.44.x"]
        flutter-channel: ["stable"]

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/gradle-build-action@v2
        with:
          generate-job-summary: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}

      - name: Preload Flutter artifacts
        run: flutter precache --android

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Generate Gradle wrapper
        run: flutter build apk --config-only

      - name: patrol build android
        run: |
          patrol build android \
          --tags='android && emulator' \
          --exclude patrol_test/web/,patrol_test/volume_test.dart \
          --dart-define-from-file=defines_1.json --dart-define-from-file=defines_2.json --dart-define-from-file=defines_3.env \
          --verbose

      - name: Collect APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          cp build/app/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/"
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/apks/"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apks
          path: ${{ runner.temp }}/apks
          if-no-files-found: error
          retention-days: 7
