name: test discovery modes

# Build-time discovery is the default, so the regular e2e workflows run it, but
# none of them checks the generated per-file class/method names (a silent
# fallback to runtime discovery would still pass) or exercises the opt-out. This
# workflow asserts the generated names, then runs the same tests again with
# `--no-emit-test-manifest`, so runtime discovery keeps its coverage.

on:
  workflow_dispatch:
  # Not `pull_request_target`: this workflow needs no secrets, and that trigger
  # would check out the base branch instead of the PR.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/patrol/**'
      - 'packages/patrol_cli/**'
      - 'packages/patrol_log/**'
      - 'packages/patrol_finders/**'
      - 'dev/e2e_app/**'
      - '.github/workflows/test-build-time-discovery.yaml'
      - '!**.md'
      - '!**.mdx'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Two files, so the run covers more than one generated class, and one of them
  # sits in a subdirectory (its class name carries the whole path).
  TARGETS: >-
    --target patrol_test/at_finder_test.dart
    --target patrol_test/internal/group_test.dart

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Next to the host test (MainActivityTest.java), relative to dev/e2e_app.
      GENERATED_DIR: android/patrolTest/src/main/java/pl/leancode/patrol/e2e_app/patrol_test

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable

      - name: Preload Flutter artifacts
        run: flutter precache --android

      - name: Set up Melos and activate workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests with build-time discovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          ram-size: 3072M
          # 37.4.2: on 37.3.10 with Flutter 3.44 the emulator dies mid-test.
          emulator-build: '16982698'
          disk-size: 6G
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim
          working-directory: dev/e2e_app
          # Both runs happen here: the emulator only exists for the duration of
          # this step.
          script: |
            patrol test $TARGETS --verbose
            patrol test-without-building --only patrol_test/at_finder_test.dart --verbose
            patrol test $TARGETS --no-emit-test-manifest --verbose

      # The last run used runtime discovery, so it must have removed the classes
      # the build-time runs generated (they would run every test twice).
      - name: Verify the runtime discovery run left no generated classes
        working-directory: dev/e2e_app
        run: |
          generated_dir=$GENERATED_DIR
          ls "$generated_dir"
          if ls "$generated_dir"/PatrolGeneratedTests*.java 2>/dev/null; then
            echo "::error::Runtime discovery left generated classes behind"; exit 1
          fi

      - name: Generate the classes again
        working-directory: dev/e2e_app
        run: patrol build android $TARGETS --verbose

      - name: Verify the generated classes
        working-directory: dev/e2e_app
        run: |
          generated_dir=$GENERATED_DIR
          echo "Generated files:"
          ls "$generated_dir"

          # One class per test file, the subdirectory folded into the class name.
          test -f "$generated_dir/PatrolGeneratedTests_at_finder_test.java"
          test -f "$generated_dir/PatrolGeneratedTests_internal_group_test.java"
          # The marker the host test class looks for, holding no tests of its own.
          test -f "$generated_dir/PatrolGeneratedTests.java"
          if grep -q '@Test' "$generated_dir/PatrolGeneratedTests.java"; then
            echo "::error::The marker class must hold no tests"; exit 1
          fi

          # The file is in the class name, so the method carries only the test.
          grep -q 'public void test_top_level_group_in_file_alpha_first()' \
            "$generated_dir/PatrolGeneratedTests_internal_group_test.java"
          # The generated classes must not stand down for the host test class.
          grep -q 'instrumentation.setUpGenerated(' \
            "$generated_dir/PatrolGeneratedTests_at_finder_test.java"


  ios:
    if: github.event.pull_request.draft != true
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: dev/e2e_app

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable

      - name: Preload Flutter artifacts
        run: flutter precache --ios

      - name: Set up Melos and activate workspace
        working-directory: .
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Set up Patrol CLI
        working-directory: packages/patrol_cli
        run: dart pub global activate --source path . && patrol

      - name: Start iOS simulator
        uses: futureware-tech/simulator-action@v2
        with:
          model: iPhone 17
          os: iOS
          os_version: '26.2'
          erase_before_boot: true
          shutdown_after_job: true

      - name: Run tests with build-time discovery
        run: |
          sleep 10 # See https://github.com/leancodepl/patrol/issues/1282
          patrol test $TARGETS --ios 26.2 --verbose

      - name: Verify the generated classes
        if: always()
        run: |
          inc=ios/RunnerUITests/PatrolGeneratedTests.inc
          cat "$inc"

          # One XCTestCase subclass per test file, inheriting the shared base.
          grep -q '@interface PatrolGeneratedTests_at_finder_test : RunnerUITests' "$inc"
          grep -q '@interface PatrolGeneratedTests_internal_group_test : RunnerUITests' "$inc"
          # The file is in the class name, so the method carries only the test.
          grep -q -- '- (void)test_top_level_group_in_file_alpha_first {' "$inc"

      - name: Verify the report groups tests by file
        run: |
          xcresult="$(ls -td build/*.xcresult | head -1)"
          xcrun xcresulttool get test-results tests --path "$xcresult" --compact > tests.json
          cat tests.json
          # A Test Suite per generated class, i.e. per Dart test file.
          grep -q '"PatrolGeneratedTests_at_finder_test"' tests.json
          grep -q '"PatrolGeneratedTests_internal_group_test"' tests.json

      - name: Run a whole file without rebuilding
        run: patrol test-without-building --only patrol_test/at_finder_test.dart --verbose

      # A project set up before Patrol 5.0 has the runner macro without the
      # #include of the generated tests. The default must fall back to runtime
      # discovery with a warning, and leave the file alone.
      - name: Run tests with a pre-5.0 RunnerUITests.m
        run: |
          cat > ios/RunnerUITests/RunnerUITests.m <<'EOF'
          @import XCTest;
          @import patrol;
          @import ObjectiveC.runtime;

          PATROL_INTEGRATION_TEST_IOS_RUNNER(RunnerUITests)
          EOF
          cp ios/RunnerUITests/RunnerUITests.m runner_before.m
          patrol test $TARGETS --ios 26.2 --verbose 2>&1 | tee runtime_run.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'Using runtime test discovery' runtime_run.log
          if ! cmp -s runner_before.m ios/RunnerUITests/RunnerUITests.m; then
            echo "::error::patrol test edited RunnerUITests.m"; exit 1
          fi

      - name: Verify runtime discovery ran the tests
        run: |
          if grep -q '@interface' ios/RunnerUITests/PatrolGeneratedTests.inc; then
            echo "::error::Runtime discovery left generated classes behind"; exit 1
          fi
          xcresult="$(ls -td build/*.xcresult | head -1)"
          xcrun xcresulttool get test-results tests --path "$xcresult" --compact > tests.json
          cat tests.json
          if grep -q 'PatrolGeneratedTests_' tests.json; then
            echo "::error::Generated test classes ran with runtime discovery"; exit 1
          fi
          # Runtime discovery names each test after its Dart name.
          grep -q 'at_finder_test' tests.json
